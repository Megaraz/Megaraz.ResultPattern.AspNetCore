name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Megaraz.ResultPattern.AspNetCore.slnx

      - name: Build
        run: dotnet build Megaraz.ResultPattern.AspNetCore.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Megaraz.ResultPattern.AspNetCore.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack Megaraz.ResultPattern.AspNetCore/Megaraz.ResultPattern.AspNetCore.csproj --configuration Release --no-build --no-restore --output artifacts
