name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate publish version checks
        shell: pwsh
        run: ./.github/scripts/test-package-version-validation.ps1

      - name: Test Source Link verification
        shell: pwsh
        run: ./.github/scripts/test-sourcelink-symbols.ps1

      - name: Restore dependencies
        run: dotnet restore Megaraz.ResultPattern.AspNetCore.slnx

      - name: Build
        run: dotnet build Megaraz.ResultPattern.AspNetCore.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Megaraz.ResultPattern.AspNetCore.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack Megaraz.ResultPattern.AspNetCore/Megaraz.ResultPattern.AspNetCore.csproj --configuration Release --no-build --no-restore --output artifacts

      - name: Validate package contents
        shell: pwsh
        run: >
          ./.github/scripts/validate-package-contents.ps1
          -PackageDirectory artifacts
          -RepositoryCommit ${{ github.sha }}

      - name: Install Source Link verification tool
        run: dotnet tool install SourceLink --tool-path .tools --version 3.1.1

      - name: Verify Source Link symbols
        shell: pwsh
        run: |
          $symbolDirectory = Join-Path $env:RUNNER_TEMP "Megaraz.ResultPattern.AspNetCore-symbols"
          try {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [System.IO.Compression.ZipFile]::ExtractToDirectory(
              (Resolve-Path artifacts/Megaraz.ResultPattern.AspNetCore.*.snupkg),
              $symbolDirectory)
            ./.github/scripts/verify-sourcelink-symbols.ps1 -SymbolDirectory $symbolDirectory -SourceLinkExecutable ./.tools/sourcelink
          }
          finally {
            Remove-Item -LiteralPath $symbolDirectory -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error
