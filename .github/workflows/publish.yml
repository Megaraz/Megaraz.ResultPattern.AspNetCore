name: Publish NuGet package

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET for package verification
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.0.0
        with:
          dotnet-version: 10.0.x

      - name: Find verified CI artifact
        id: verified-ci
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              head_sha: context.sha,
              status: "success",
              per_page: 100
            });
            const run = data.workflow_runs.find(candidate =>
              candidate.event === "push" &&
              candidate.head_branch === context.payload.repository.default_branch);
            if (!run) {
              core.setFailed(`No successful CI run was found for ${context.sha}.`);
              return;
            }
            core.setOutput("run-id", run.id);

      - name: Download verified CI package
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: nuget-packages
          path: artifacts
          repository: ${{ github.repository }}
          run-id: ${{ steps.verified-ci.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >
          ./.github/scripts/validate-package-version.ps1
          -Tag $env:RELEASE_TAG
          -ProjectPath Megaraz.ResultPattern.AspNetCore/Megaraz.ResultPattern.AspNetCore.csproj
          -PackageDirectory artifacts

      - name: Validate package contents
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: >
          ./.github/scripts/validate-package-contents.ps1
          -PackageDirectory artifacts
          -RepositoryCommit $env:RELEASE_COMMIT

      - name: Install Source Link verification tool
        run: dotnet tool install SourceLink --tool-path .tools --version 3.1.1

      - name: Verify Source Link symbols
        shell: pwsh
        run: |
          $symbolDirectory = Join-Path $env:RUNNER_TEMP "Megaraz.ResultPattern.AspNetCore-symbols"
          try {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [System.IO.Compression.ZipFile]::ExtractToDirectory(
              (Resolve-Path artifacts/Megaraz.ResultPattern.AspNetCore.*.snupkg),
              $symbolDirectory)
            ./.github/scripts/verify-sourcelink-symbols.ps1 -SymbolDirectory $symbolDirectory -SourceLinkExecutable ./.tools/sourcelink
          }
          finally {
            Remove-Item -LiteralPath $symbolDirectory -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        run: |
          find artifacts -maxdepth 1 -type f -name '*.nupkg' ! -name '*.snupkg' -exec \
            dotnet nuget push '{}' --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json \
            \;
          dotnet nuget push artifacts/*.snupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
