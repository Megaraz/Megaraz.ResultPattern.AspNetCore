name: Publish NuGet package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Megaraz.ResultPattern.AspNetCore.slnx

      - name: Build
        run: dotnet build Megaraz.ResultPattern.AspNetCore.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Megaraz.ResultPattern.AspNetCore.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack Megaraz.ResultPattern.AspNetCore/Megaraz.ResultPattern.AspNetCore.csproj --configuration Release --no-build --no-restore --output artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
